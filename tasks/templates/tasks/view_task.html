<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ task.title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 40px 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 28px; width: 100%; max-width: 600px; }
        h1 { margin-bottom: 12px; color: #f1f5f9; }
        .desc { color: #cbd5e1; line-height: 1.6; margin-bottom: 20px; background: #0f172a; padding: 14px; border-radius: 8px; }
        .status { margin-bottom: 24px; font-size: 0.9rem; color: #38bdf8; }
        .actions { display: flex; gap: 10px; border-top: 1px solid #334155; padding-top: 20px; }
        .btn { padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        .btn-back { background: #334155; color: white; }
        .btn-edit { background: #0284c7; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ task.title }}</h1>
        <div class="desc">{{ task.description|default:"Описание отсутствует." }}</div>
        
        {% if task.completed %}
            <p class="status">✓ Статус: Выполнено</p>
        {% endif %}

        <div class="actions">
            <a href="{% url 'index' %}" class="btn btn-back">← Назад к списку</a>
            <a href="{% url 'edit_task' task.id %}" class="btn btn-edit">Редактировать</a>
        </div>
    </div>
</body>
</html>
