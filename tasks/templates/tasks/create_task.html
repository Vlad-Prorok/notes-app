<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать новую задачу</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 40px 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 28px; width: 100%; max-width: 500px; }
        h1 { margin-bottom: 20px; font-size: 1.5rem; }
        label { display: block; margin-bottom: 6px; color: #94a3b8; font-size: 0.9rem; }
        input[type="text"], textarea { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; margin-bottom: 16px; outline: none; }
        textarea { resize: vertical; min-height: 100px; }
        .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px; }
        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; text-decoration: none; font-weight: 600; }
        .btn-submit { background: #6366f1; color: white; }
        .btn-cancel { background: #334155; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Создать новую задачу</h1>
        <form method="POST">
            {% csrf_token %}
            <label for="title">Название</label>
            <input type="text" name="title" id="title" required placeholder="Введите название...">

            <label for="description">Описание</label>
            <textarea name="description" id="description" placeholder="Подробное описание..."></textarea>

            <div class="actions">
                <a href="{% url 'index' %}" class="btn btn-cancel">Отмена</a>
                <button type="submit" class="btn btn-submit">Создать</button>
            </div>
        </form>
    </div>
</body>
</html>
